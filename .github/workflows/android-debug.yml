name: Scrapella Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "client/assets/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Scrapella CI signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/scrapella-ci-release.keystore
          key: scrapella-ci-release-signing-v1

      - name: Create CI release signing key when missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/scrapella-ci-release.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/scrapella-ci-release.keystore"               -storepass scrapella-ci               -alias scrapella               -keypass scrapella-ci               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Scrapella CI,O=Scrapella,C=PH"
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Android push when credentials are available
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase Android push configuration installed."
          else
            echo "FIREBASE_ANDROID_GOOGLE_SERVICES_JSON is not configured; realtime/local notification fallback will still build."
          fi

      - name: Keep navigation inside Scrapella and hide Android navigation bar
        run: |
          cat > android/app/src/main/java/com/loukang/scrapella/MainActivity.java <<'JAVA'
          package com.loukang.scrapella;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MicrophonePermissionPlugin.class);
                  registerPlugin(NativeAudioPlayerPlugin.class);
                  super.onCreate(savedInstanceState);
                  createMessageNotificationChannel();
                  hideNavigationBar();
              }

              private void createMessageNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;
                      NotificationChannel channel = new NotificationChannel(
                          "messages",
                          "Messages",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Scrapella chat messages");
                      channel.enableVibration(true);
                      channel.setLockscreenVisibility(android.app.Notification.VISIBILITY_PRIVATE);
                      manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideNavigationBar();
              }

              private void hideNavigationBar() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/loukang/scrapella/NativeAudioPlayerPlugin.java <<'JAVA'
          package com.loukang.scrapella;

          import android.media.MediaPlayer;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "NativeAudioPlayer")
          public class NativeAudioPlayerPlugin extends Plugin {
              private MediaPlayer player;
              private File tempFile;

              private void stopInternal() {
                  try {
                      if (player != null) {
                          if (player.isPlaying()) player.stop();
                          player.release();
                      }
                  } catch (Exception ignored) {}
                  player = null;
                  try {
                      if (tempFile != null && tempFile.exists()) tempFile.delete();
                  } catch (Exception ignored) {}
                  tempFile = null;
              }

              @PluginMethod
              public void play(PluginCall call) {
                  String data = call.getString("data", "");
                  if (data == null || data.isEmpty()) {
                      call.reject("Missing audio data.");
                      return;
                  }
                  try {
                      stopInternal();
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      tempFile = File.createTempFile("scrapella-voice-", ".wav", getContext().getCacheDir());
                      try (FileOutputStream output = new FileOutputStream(tempFile)) {
                          output.write(bytes);
                          output.flush();
                      }
                      player = new MediaPlayer();
                      player.setDataSource(tempFile.getAbsolutePath());
                      player.setOnCompletionListener(mp -> {
                          JSObject event = new JSObject();
                          event.put("ended", true);
                          notifyListeners("ended", event);
                          stopInternal();
                      });
                      player.prepare();
                      int durationMs = player.getDuration();
                      player.start();
                      JSObject result = new JSObject();
                      result.put("durationMs", durationMs);
                      call.resolve(result);
                  } catch (Exception error) {
                      stopInternal();
                      call.reject("Could not play voice message.", error);
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  stopInternal();
                  call.resolve();
              }

              @Override
              protected void handleOnDestroy() {
                  stopInternal();
                  super.handleOnDestroy();
              }
          }
          JAVA

          cat > android/app/src/main/java/com/loukang/scrapella/MicrophonePermissionPlugin.java <<'JAVA'
          package com.loukang.scrapella;

          import android.Manifest;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "MicrophonePermission",
              permissions = {
                  @Permission(alias = "microphone", strings = { Manifest.permission.RECORD_AUDIO })
              }
          )
          public class MicrophonePermissionPlugin extends Plugin {
              private void resolveState(PluginCall call) {
                  PermissionState state = getPermissionState("microphone");
                  JSObject result = new JSObject();
                  String value = state == PermissionState.GRANTED
                      ? "granted"
                      : state == PermissionState.DENIED
                          ? "denied"
                          : "prompt";
                  result.put("microphone", value);
                  call.resolve(result);
              }

              @PluginMethod
              public void check(PluginCall call) {
                  resolveState(call);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  if (getPermissionState("microphone") == PermissionState.GRANTED) {
                      resolveState(call);
                      return;
                  }
                  requestPermissionForAlias("microphone", call, "microphonePermissionCallback");
              }

              @PermissionCallback
              private void microphonePermissionCallback(PluginCall call) {
                  resolveState(call);
              }
          }
          JAVA

      - name: Configure Android app permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          missing = [item for item in permissions if item.split('"')[1] not in manifest]
          if missing:
              pos = manifest.find(">", manifest.find("<manifest"))
              addition = "\n    " + "\n    ".join(missing)
              manifest = manifest[:pos+1] + addition + manifest[pos+1:]
          app_tag = '<application'
          app_pos = manifest.find(app_tag)
          if app_pos >= 0 and 'com.google.firebase.messaging.default_notification_channel_id' not in manifest:
              close_pos = manifest.find('>', app_pos)
              metadata = '''
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_channel_id"
                  android:value="messages" />'''
              manifest = manifest[:close_pos+1] + metadata + manifest[close_pos+1:]
          manifest_path.write_text(manifest)
          PY

      - name: Configure release signing and app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_path = Path("android/app/build.gradle")
          gradle = gradle_path.read_text()

          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 233', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.2.14"', gradle, count=1)

          if 'scrapella-ci-release.keystore' not in gradle:
              gradle = gradle.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  scrapellaRelease {
                      storeFile file(System.getProperty("user.home") + "/.android/scrapella-ci-release.keystore")
                      storePassword "scrapella-ci"
                      keyAlias "scrapella"
                      keyPassword "scrapella-ci"
                  }
              }''',
                  1
              )
              gradle = gradle.replace(
                  'buildTypes {\n        release {',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.scrapellaRelease',
                  1
              )

          gradle_path.write_text(gradle)
          PY

      - name: Create Scrapella native artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path(".")
          logo = Image.open(root / "client/assets/scrapella-logo.webp").convert("RGBA")
          cream = (250, 248, 242, 255)
          resources = root / "resources"
          resources.mkdir(exist_ok=True)

          # Keep the entire Scrapella wordmark visible inside the app icon.
          artwork = logo.crop((22, 108, 490, 382))
          icon = Image.new("RGBA", (1024, 1024), cream)
          scale = min(790 / artwork.width, 790 / artwork.height)
          artwork = artwork.resize((round(artwork.width * scale), round(artwork.height * scale)), Image.Resampling.LANCZOS)
          icon.alpha_composite(artwork, ((1024 - artwork.width) // 2, (1024 - artwork.height) // 2))
          icon.save(resources / "icon.png")

          # Static native splash shows the complete brand before the live pencil trace.
          splash = Image.new("RGBA", (2732, 2732), cream)
          splash_art = logo.crop((18, 92, 494, 395))
          scale = min(2100 / splash_art.width, 1300 / splash_art.height)
          splash_art = splash_art.resize((round(splash_art.width * scale), round(splash_art.height * scale)), Image.Resampling.LANCZOS)
          splash.alpha_composite(splash_art, ((2732 - splash_art.width)//2, (2732 - splash_art.height)//2))
          splash.save(resources / "splash.png")
          PY

      - name: Generate Android icons and splash assets
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Scrapella Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: scrapella-android-release-v2.2.14
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
