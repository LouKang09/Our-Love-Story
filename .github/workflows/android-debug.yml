name: Scrapella Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "client/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Scrapella CI signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/scrapella-ci-release.keystore
          key: scrapella-ci-release-signing-v1

      - name: Create CI release signing key when missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/scrapella-ci-release.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/scrapella-ci-release.keystore"               -storepass scrapella-ci               -alias scrapella               -keypass scrapella-ci               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Scrapella CI,O=Scrapella,C=PH"
          fi

      - name: Install JavaScript dependencies
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" ]; then
            npm pkg delete dependencies.@capacitor/push-notifications
            echo "Android hotfix: native Firebase PushNotifications excluded."
          fi
          npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Android push when credentials are available
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase Android push configuration installed."
          else
            echo "FIREBASE_ANDROID_GOOGLE_SERVICES_JSON is not configured; realtime/local notification fallback will still build."
          fi

      - name: Keep navigation inside Scrapella and hide Android navigation bar
        run: |
          cat > android/app/src/main/java/com/loukang/scrapella/MainActivity.java <<'JAVA'
          package com.loukang.scrapella;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
              private static final String SCRAPELLA_URL = "https://scrapella.up.railway.app";
              private final Handler retryHandler = new Handler(Looper.getMainLooper());
              private int mainFrameRetryCount = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MicrophonePermissionPlugin.class);
                  registerPlugin(NotificationPermissionPlugin.class);
                  super.onCreate(savedInstanceState);
                  installResilientWebViewClient();
                  hideNavigationBar();
              }

              @Override
              public void onDestroy() {
                  retryHandler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideNavigationBar();
              }

              private void installResilientWebViewClient() {
                  if (bridge == null || bridge.getWebView() == null) return;
                  WebView webView = bridge.getWebView();
                  webView.setWebViewClient(new BridgeWebViewClient(bridge) {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (url != null && url.startsWith(SCRAPELLA_URL)) {
                              mainFrameRetryCount = 0;
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          boolean mainFrame = request != null && request.isForMainFrame();
                          int code = error == null ? WebViewClient.ERROR_UNKNOWN : error.getErrorCode();
                          if (mainFrame && isTransientNetworkError(code) && mainFrameRetryCount < 4) {
                              mainFrameRetryCount++;
                              view.stopLoading();
                              long delayMs = Math.min(6000L, 1200L * mainFrameRetryCount);
                              retryHandler.postDelayed(() -> {
                                  if (!isFinishing() && !isDestroyed() && bridge != null && bridge.getWebView() != null) {
                                      bridge.getWebView().loadUrl(SCRAPELLA_URL);
                                  }
                              }, delayMs);
                              return;
                          }
                          super.onReceivedError(view, request, error);
                      }
                  });
              }

              private boolean isTransientNetworkError(int code) {
                  return code == WebViewClient.ERROR_TIMEOUT
                      || code == WebViewClient.ERROR_HOST_LOOKUP
                      || code == WebViewClient.ERROR_CONNECT
                      || code == WebViewClient.ERROR_IO
                      || code == WebViewClient.ERROR_UNKNOWN;
              }

              private void hideNavigationBar() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          JAVA

          cat > android/app/src/main/java/com/loukang/scrapella/MicrophonePermissionPlugin.java <<'JAVA'
          package com.loukang.scrapella;

          import android.Manifest;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "MicrophonePermission",
              permissions = {
                  @Permission(alias = "microphone", strings = { Manifest.permission.RECORD_AUDIO })
              }
          )
          public class MicrophonePermissionPlugin extends Plugin {
              private void resolveState(PluginCall call) {
                  PermissionState state = getPermissionState("microphone");
                  JSObject result = new JSObject();
                  String value = state == PermissionState.GRANTED
                      ? "granted"
                      : state == PermissionState.DENIED
                          ? "denied"
                          : "prompt";
                  result.put("microphone", value);
                  call.resolve(result);
              }

              @PluginMethod
              public void check(PluginCall call) {
                  resolveState(call);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  if (getPermissionState("microphone") == PermissionState.GRANTED) {
                      resolveState(call);
                      return;
                  }
                  requestPermissionForAlias("microphone", call, "microphonePermissionCallback");
              }

              @PermissionCallback
              private void microphonePermissionCallback(PluginCall call) {
                  resolveState(call);
              }
          }
          JAVA

          cat > android/app/src/main/java/com/loukang/scrapella/NotificationPermissionPlugin.java <<'JAVA'
          package com.loukang.scrapella;

          import android.Manifest;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "NotificationPermission",
              permissions = {
                  @Permission(alias = "notifications", strings = { Manifest.permission.POST_NOTIFICATIONS })
              }
          )
          public class NotificationPermissionPlugin extends Plugin {
              private boolean enabled() {
                  return NotificationManagerCompat.from(getContext()).areNotificationsEnabled();
              }

              private void resolveState(PluginCall call, String value) {
                  JSObject result = new JSObject();
                  result.put("notifications", value);
                  result.put("enabled", enabled());
                  result.put("runtimePrompt", Build.VERSION.SDK_INT >= 33);
                  call.resolve(result);
              }

              @PluginMethod
              public void check(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      PermissionState state = getPermissionState("notifications");
                      if (state == PermissionState.GRANTED && enabled()) resolveState(call, "granted");
                      else if (state == PermissionState.DENIED) resolveState(call, "denied");
                      else resolveState(call, enabled() ? "granted" : "prompt");
                      return;
                  }
                  resolveState(call, enabled() ? "granted" : "denied");
              }

              @PluginMethod
              public void request(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33 && getPermissionState("notifications") != PermissionState.GRANTED) {
                      requestPermissionForAlias("notifications", call, "notificationPermissionCallback");
                      return;
                  }
                  if (enabled()) {
                      resolveState(call, "granted");
                      return;
                  }
                  openNotificationSettings();
                  resolveState(call, "settings");
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  openNotificationSettings();
                  resolveState(call, "settings");
              }

              private void openNotificationSettings() {
                  try {
                      Intent intent = new Intent();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          intent.setAction(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                          intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
                      } else {
                          intent.setAction(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                      }
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                  } catch (Exception ignored) {}
              }

              @PermissionCallback
              private void notificationPermissionCallback(PluginCall call) {
                  check(call);
              }
          }
          JAVA

      - name: Configure Huawei Push Kit when credentials are available
        env:
          HUAWEI_AGCONNECT_SERVICES_JSON: ${{ secrets.HUAWEI_AGCONNECT_SERVICES_JSON }}
        run: |
          if [ -z "$HUAWEI_AGCONNECT_SERVICES_JSON" ]; then
            echo "Huawei AppGallery credentials are not configured; HMS push bridge skipped."
            exit 0
          fi
          printf '%s' "$HUAWEI_AGCONNECT_SERVICES_JSON" > android/app/agconnect-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()
          if "https://developer.huawei.com/repo/" not in text:
              text = text.replace("google()", "google()\n        maven { url 'https://developer.huawei.com/repo/' }")
          if "com.huawei.agconnect:agcp" not in text:
              marker = "dependencies {"
              pos = text.find(marker)
              if pos >= 0:
                  pos += len(marker)
                  text = text[:pos] + "\n        classpath 'com.huawei.agconnect:agcp:1.9.1.300'" + text[pos:]
          root.write_text(text)

          app = Path("android/app/build.gradle")
          gradle = app.read_text()
          if "com.huawei.hms:push" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation 'com.huawei.hms:push:6.13.0.300'", 1)
          if "apply plugin: 'com.huawei.agconnect'" not in gradle:
              gradle += "\napply plugin: 'com.huawei.agconnect'\n"
          app.write_text(gradle)

          main = Path("android/app/src/main/java/com/loukang/scrapella/MainActivity.java")
          main_text = main.read_text()
          if "HuaweiPushPlugin.class" not in main_text:
              main_text = main_text.replace("registerPlugin(NotificationPermissionPlugin.class);", "registerPlugin(NotificationPermissionPlugin.class);\n                  registerPlugin(HuaweiPushPlugin.class);")
          main.write_text(main_text)
          PY

          cat > android/app/src/main/java/com/loukang/scrapella/HuaweiPushPlugin.java <<'JAVA'
          package com.loukang.scrapella;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.huawei.agconnect.config.AGConnectServicesConfig;
          import com.huawei.hms.aaid.HmsInstanceId;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "HuaweiPush")
          public class HuaweiPushPlugin extends Plugin {
              @PluginMethod
              public void getToken(PluginCall call) {
                  Executors.newSingleThreadExecutor().execute(() -> {
                      try {
                          String appId = AGConnectServicesConfig.fromContext(getContext()).getString("client/app_id");
                          String token = HmsInstanceId.getInstance(getContext()).getToken(appId, "HCM");
                          JSObject result = new JSObject();
                          result.put("token", token == null ? "" : token);
                          call.resolve(result);
                      } catch (Exception error) {
                          call.reject("Huawei Push Kit token unavailable", error);
                      }
                  });
              }
          }
          JAVA

      - name: Configure Android app permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
          ]
          missing = [item for item in permissions if item.split('"')[1] not in manifest]
          if missing:
              pos = manifest.find(">", manifest.find("<manifest"))
              addition = "\n    " + "\n    ".join(missing)
              manifest = manifest[:pos+1] + addition + manifest[pos+1:]
          manifest_path.write_text(manifest)
          PY

      - name: Configure release signing and app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_path = Path("android/app/build.gradle")
          gradle = gradle_path.read_text()

          gradle = re.sub(r'versionCode\\s+\\d+', 'versionCode 250', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.4.9"', gradle, count=1)

          if 'scrapella-ci-release.keystore' not in gradle:
              gradle = gradle.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  scrapellaRelease {
                      storeFile file(System.getProperty("user.home") + "/.android/scrapella-ci-release.keystore")
                      storePassword "scrapella-ci"
                      keyAlias "scrapella"
                      keyPassword "scrapella-ci"
                  }
              }''',
                  1
              )
              gradle = gradle.replace(
                  'buildTypes {\n        release {',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.scrapellaRelease',
                  1
              )

          gradle_path.write_text(gradle)
          PY

      - name: Create Scrapella native artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path(".")
          logo = Image.open(root / "client/assets/scrapella-logo.webp").convert("RGBA")
          cream = (250, 248, 242, 255)
          resources = root / "resources"
          resources.mkdir(exist_ok=True)

          # Keep the entire Scrapella wordmark visible inside the app icon.
          artwork = logo.crop((22, 108, 490, 382))
          icon = Image.new("RGBA", (1024, 1024), cream)
          scale = min(790 / artwork.width, 790 / artwork.height)
          artwork = artwork.resize((round(artwork.width * scale), round(artwork.height * scale)), Image.Resampling.LANCZOS)
          icon.alpha_composite(artwork, ((1024 - artwork.width) // 2, (1024 - artwork.height) // 2))
          icon.save(resources / "icon.png")

          # Static native splash shows the complete brand before the live pencil trace.
          splash = Image.new("RGBA", (2732, 2732), cream)
          splash_art = logo.crop((18, 92, 494, 395))
          scale = min(2100 / splash_art.width, 1300 / splash_art.height)
          splash_art = splash_art.resize((round(splash_art.width * scale), round(splash_art.height * scale)), Image.Resampling.LANCZOS)
          splash.alpha_composite(splash_art, ((2732 - splash_art.width)//2, (2732 - splash_art.height)//2))
          splash.save(resources / "splash.png")
          PY

      - name: Generate Android icons and splash assets
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create Scrapella notification status icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_scrapella.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="256"
              android:viewportHeight="256">
              <path
                  android:pathData="M122,62 C94,37 50,41 41,75 C33,106 72,110 100,125 C127,140 123,176 97,193 C70,211 38,198 39,170 C40,147 59,134 88,127 C110,121 126,123 137,133"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="18"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"/>
              <path
                  android:pathData="M151,70 C159,55 181,58 184,74 C187,58 209,55 217,70 C228,91 199,112 184,125 C169,112 140,91 151,70 Z"
                  android:fillColor="#FFFFFFFF"/>
              <path
                  android:pathData="M105,205 C125,200 149,198 174,200"
                  android:fillColor="@android:color/transparent"
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="10"
                  android:strokeLineCap="round"/>
              <path
                  android:pathData="M58,195 C66,179 76,171 87,165 C86,179 82,193 71,204 Z"
                  android:fillColor="#FFFFFFFF"/>
              <path
                  android:pathData="M71,164 A9,9 0,1 0,71 182 A9,9 0,1 0,71 164"
                  android:fillColor="#FFFFFFFF"/>
          </vector>
          XML

          # Notification shade artwork: Android still requires a monochrome
          # status-bar icon, but the notification card now uses Scrapella's
          # actual launcher artwork instead of a generic alert glyph.
          mkdir -p android/app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("resources/icon.png")
          out=Path("android/app/src/main/res/drawable-nodpi/scrapella_notification_large.png")
          im=Image.open(src).convert("RGBA")
          im.thumbnail((256,256),Image.Resampling.LANCZOS)
          canvas=Image.new("RGBA",(256,256),(0,0,0,0))
          canvas.alpha_composite(im,((256-im.width)//2,(256-im.height)//2))
          canvas.save(out)
          PY

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Scrapella Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: scrapella-android-release-v2.4.9
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
