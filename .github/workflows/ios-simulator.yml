name: Scrapella iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "client/**"
      - ".github/workflows/ios-simulator.yml"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project
        run: npx cap add ios

      - name: Configure iOS app permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          plist_path = Path("ios/App/App/Info.plist")
          with plist_path.open("rb") as fh:
              plist = plistlib.load(fh)
          plist["NSCameraUsageDescription"] = "Scrapella uses your camera when you choose to take a photo for a memory or message."
          plist["NSPhotoLibraryUsageDescription"] = "Scrapella lets you choose photos from your library to add to scrapbooks and messages."
          plist["NSPhotoLibraryAddUsageDescription"] = "Scrapella can save photos to your library when you choose to save them."
          plist["NSMicrophoneUsageDescription"] = "Scrapella uses your microphone when you record and send a voice message."
          plist["CFBundleShortVersionString"] = "2.4.0"
          plist["CFBundleVersion"] = "240"
          with plist_path.open("wb") as fh:
              plistlib.dump(plist, fh)

          app_delegate = Path("ios/App/App/AppDelegate.swift")
          swift = app_delegate.read_text()
          marker = "capacitorDidRegisterForRemoteNotifications"
          if marker not in swift:
              methods = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
              pos = swift.rfind("}")
              swift = swift[:pos] + methods + "\n" + swift[pos:]
              app_delegate.write_text(swift)
          PY

      - name: Create Scrapella native artwork
        run: |
          python3 -m venv .scrapella-venv
          source .scrapella-venv/bin/activate
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path(".")
          logo = Image.open(root / "client/assets/scrapella-logo.webp").convert("RGBA")
          cream = (250, 248, 242, 255)
          resources = root / "resources"
          resources.mkdir(exist_ok=True)

          # Keep the complete Scrapella lettering visible on the iOS icon.
          artwork = logo.crop((22, 108, 490, 382))
          icon = Image.new("RGBA", (1024, 1024), cream)
          scale = min(790 / artwork.width, 790 / artwork.height)
          artwork = artwork.resize((round(artwork.width * scale), round(artwork.height * scale)), Image.Resampling.LANCZOS)
          icon.alpha_composite(artwork, ((1024 - artwork.width) // 2, (1024 - artwork.height) // 2))
          icon.convert("RGB").save(resources / "icon.png")

          splash = Image.new("RGBA", (2732, 2732), cream)
          splash_art = logo.crop((18, 92, 494, 395))
          scale = min(2100 / splash_art.width, 1300 / splash_art.height)
          splash_art = splash_art.resize((round(splash_art.width * scale), round(splash_art.height * scale)), Image.Resampling.LANCZOS)
          splash.alpha_composite(splash_art, ((2732 - splash_art.width)//2, (2732 - splash_art.height)//2))
          splash.convert("RGB").save(resources / "splash.png")
          PY

      - name: Generate iOS icons and splash assets
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/assets
          npx capacitor-assets generate --ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: scrapella-ios-simulator-v2.4.0
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned iPhone release
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/device-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package single iOS IPA
        run: |
          rm -rf Payload Scrapella-iOS-Unsigned.ipa
          mkdir -p Payload
          cp -R ios/device-build/Build/Products/Release-iphoneos/App.app Payload/Scrapella.app
          zip -qry Scrapella-iOS-Unsigned.ipa Payload

      - name: Upload single iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: scrapella-ios-unsigned-ipa-v2.4.0
          path: Scrapella-iOS-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
